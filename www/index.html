<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くすっとゲームズ</title>
<link rel="stylesheet" href="style/base.css">
<link rel="stylesheet" href="style/lottery.css">
<link rel="stylesheet" href="style/proverb.css">
<link rel="stylesheet" href="style/bangs.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="くすっと">
</head>
<body>

<!-- 画面: ホーム -->
<section id="screen-home" class="screen">
  <header class="brand">
    <div class="mascot">😏</div>
    <h1>くすっとゲームズ</h1>
    <p class="tagline">はっと気づいて、くすっと笑う。</p>
  </header>

  <ul class="game-list">
    <li><button class="game-item" data-game="lottery">
      <span class="game-icon">🎟️</span>
      <span class="game-body">
        <span class="game-name">宝くじ確率いいかえ</span>
        <span class="game-desc">当選確率を、身近な出来事でいいかえます</span>
      </span>
    </button></li>
    <li><button class="game-item" data-game="proverb">
      <span class="game-icon">📜</span>
      <span class="game-body">
        <span class="game-name">ことわざクイズ</span>
        <span class="game-desc">このシチュエーション、あなたならどうする？</span>
      </span>
    </button></li>
    <li><button class="game-item" data-game="bangs">
      <span class="game-icon">💇</span>
      <span class="game-body">
        <span class="game-name">前髪のびたかゲーム</span>
        <span class="game-desc">待ち合わせの彼女、どこが変わった？</span>
      </span>
    </button></li>
  </ul>
</section>

<!-- 画面: 宝くじ確率いいかえ -->
<section id="screen-lottery" class="screen hidden">
  <header class="game-header">
    <button class="btn-text back-to-home">← ホームへ</button>
    <span class="progress-label hidden" id="lottery-progress"></span>
  </header>

  <div class="lottery-mode-select" id="lottery-mode-select">
    <p class="lottery-mode-lead">モードを選んでください</p>
    <button class="mode-card" data-mode="general" type="button">
      <span class="mode-card-title">一般編</span>
      <span class="mode-card-desc">身近な出来事の確率でいいかえます</span>
    </button>
    <button class="mode-card" data-mode="gambler" type="button">
      <span class="mode-card-title">ギャンブラー編</span>
      <span class="mode-card-desc">パチンコの大当たり確率でいいかえます</span>
    </button>
    <button class="mode-card" data-mode="mix" type="button">
      <span class="mode-card-title">ミックス</span>
      <span class="mode-card-desc">一般編とギャンブラー編がランダムに出題されます</span>
    </button>
  </div>

  <div class="lottery-play hidden" id="lottery-play">
    <div class="lottery-puzzle-card">
      <p class="lottery-target-label" id="lottery-target-label">読み込み中…</p>
      <p class="lottery-sentence" id="lottery-sentence"></p>
      <button id="lottery-check" class="btn-primary btn-large" disabled>確かめる</button>
    </div>

    <div class="lottery-answer hidden" id="lottery-answer">
      <p class="lottery-answer-verdict" id="lottery-answer-verdict"></p>

      <div class="lottery-wrong-actions hidden" id="lottery-wrong-actions">
        <button id="lottery-retry" class="btn-secondary btn-half">もう一度挑戦</button>
        <button id="lottery-reveal" class="btn-primary btn-half">回答を見る</button>
      </div>

      <div class="lottery-breakdown-section hidden" id="lottery-breakdown-section">
        <div class="lottery-breakdown" id="lottery-breakdown"></div>
        <p class="lottery-ratio hidden" id="lottery-ratio"></p>
        <button id="lottery-next" class="btn-primary btn-large">次の問題へ</button>
      </div>
    </div>
  </div>
</section>

<!-- 画面: ことわざクイズ -->
<section id="screen-proverb" class="screen hidden">
  <header class="game-header">
    <button class="btn-text back-to-home">← ホームへ</button>
    <span class="progress-label" id="proverb-progress"></span>
  </header>

  <p class="proverb-situation" id="proverb-situation">読み込み中…</p>
  <p class="proverb-question">あなたなら、どうする？</p>

  <div class="proverb-choices" id="proverb-choices"></div>

  <div class="proverb-reveal hidden" id="proverb-reveal"></div>
  <button id="proverb-next" class="btn-primary btn-large hidden">次へ</button>
</section>

<!-- 画面: 前髪のびたかゲーム -->
<section id="screen-bangs" class="screen hidden">
  <header class="game-header">
    <button class="btn-text back-to-home">← ホームへ</button>
  </header>

  <div class="bangs-body">
    <p class="bangs-instruction" id="bangs-instruction">待ち合わせ場所にやってきた彼女。よく見ておいてください。</p>
    <div class="bangs-avatar" id="bangs-avatar-before">
      <div class="avatar-hair"></div>
      <div class="avatar-head"></div>
      <div class="avatar-top"></div>
      <div class="avatar-shoes"></div>
      <div class="avatar-bag"></div>
    </div>
    <p class="bangs-timer" id="bangs-timer">5</p>
  </div>

  <div class="bangs-judge hidden" id="bangs-judge-group">
    <p class="bangs-question">目を離したすきに、何かが変わったような…どこが変わった?</p>
    <div class="bangs-avatar" id="bangs-avatar-after">
      <div class="avatar-hair"></div>
      <div class="avatar-head"></div>
      <div class="avatar-top"></div>
      <div class="avatar-shoes"></div>
      <div class="avatar-bag"></div>
    </div>
    <div class="bangs-choices" id="bangs-choices"></div>
  </div>
</section>

<!-- 画面: 結果(3ゲーム共通) -->
<section id="screen-result" class="screen hidden">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🤔</div>
    <h2 class="result-title" id="result-title"></h2>
    <p class="result-message" id="result-message"></p>
    <p class="result-tease" id="result-tease"></p>
  </div>

  <button id="result-retry" class="btn-primary btn-large">もう一度</button>
  <button class="btn-secondary back-to-home">ホームへ</button>
</section>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
